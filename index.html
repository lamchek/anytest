<!-- Centered layout logic (aspect exact in Unity buffer pixels) -->
<script>
    (function setupCenteredCanvas(options) {
        const AREA_FRACTION = (options && options.areaFraction) ?? 0.60;
        const CONTAINER_ID  = (options && options.containerId)  || 'unity-container';
        const CANVAS_ID     = (options && options.canvasId)     || 'unity-canvas';

        // exact aspect W:H = 1:2
        const ASPECT_W = (options && options.aspectW) || 3;
        const ASPECT_H = (options && options.aspectH) || 4;

        const LANDSCAPE_MAXIMIZE = (options && options.landscapeMaximize) ?? true;

        const container = document.getElementById(CONTAINER_ID);
        const canvas = document.getElementById(CANVAS_ID);
        if (!container || !canvas) return;

        container.style.position = 'fixed';
        container.style.boxSizing = 'border-box';
        container.style.transform = 'none';
        container.style.margin = '0';

        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.display = 'block';

        // Это render DPR (ровно то, что вы кладёте в config.devicePixelRatio)
        // По умолчанию — текущий screen DPR, пока вы не вызвали u59SetRenderDpr().
        let currentRenderDpr = window.devicePixelRatio || 1;

        function getViewportRectCss() {
            const vv = window.visualViewport;
            const vw = vv ? vv.width : window.innerWidth;
            const vh = vv ? vv.height : window.innerHeight;
            const ox = vv ? vv.offsetLeft : 0;
            const oy = vv ? vv.offsetTop : 0;
            return { vw, vh, ox, oy };
        }

        function computeRectCss(renderDpr) {
            const { vw, vh, ox, oy } = getViewportRectCss();

            // viewport в "buffer px" (в тех пикселях, где Unity рисует при devicePixelRatio=renderDpr)
            const vpW = Math.max(0, Math.floor(vw * renderDpr));
            const vpH = Math.max(0, Math.floor(vh * renderDpr));

            const isLandscape = vw >= vh;

            function byHeight(hPx) {
                hPx = Math.floor(hPx);
                hPx = Math.floor(hPx / ASPECT_H) * ASPECT_H;     // кратно ASPECT_H (для 1:2 => чётное)
                const wPx = (hPx / ASPECT_H) * ASPECT_W;         // строго целое
                return { wPx, hPx };
            }

            function byWidth(wPx) {
                wPx = Math.floor(wPx);
                wPx = Math.floor(wPx / ASPECT_W) * ASPECT_W;
                const hPx = (wPx / ASPECT_W) * ASPECT_H;
                return { wPx, hPx };
            }

            let wBuf = 0, hBuf = 0;

            if (isLandscape && LANDSCAPE_MAXIMIZE) {
                // contain max, сравнение без float:
                if (vpW * ASPECT_H >= vpH * ASPECT_W) {
                    ({ wPx: wBuf, hPx: hBuf } = byHeight(vpH));
                    if (wBuf > vpW) ({ wPx: wBuf, hPx: hBuf } = byWidth(vpW));
                } else {
                    ({ wPx: wBuf, hPx: hBuf } = byWidth(vpW));
                    if (hBuf > vpH) ({ wPx: wBuf, hPx: hBuf } = byHeight(vpH));
                }
            } else {
                const targetArea = AREA_FRACTION * vpW * vpH;

                const hIdeal = Math.sqrt(targetArea * ASPECT_H / ASPECT_W);
                const wIdeal = hIdeal * ASPECT_W / ASPECT_H;

                const c1 = byHeight(hIdeal);
                const c2 = byWidth(wIdeal);

                function fits(c) { return c.wPx <= vpW && c.hPx <= vpH && c.wPx > 0 && c.hPx > 0; }
                // берём кандидата с большей площадью (обычно лучше, чем "ближе к targetArea", и стабильнее)
                const cand = [c1, c2].filter(fits).sort((a,b) => (b.wPx*b.hPx)-(a.wPx*a.hPx))[0]
                    || (vpW * ASPECT_H >= vpH * ASPECT_W ? byHeight(vpH) : byWidth(vpW));

                wBuf = cand.wPx;
                hBuf = cand.hPx;
            }

            // перевод buffer px -> CSS px
            const wCss = wBuf / renderDpr;
            const hCss = hBuf / renderDpr;

            // центрирование
            let xCss = ox + (vw - wCss) / 2;
            let yCss = oy + (vh - hCss) / 2;

            // position снапим к screen пикселям (иначе могут быть субпиксели по позиции)
            const screenDpr = window.devicePixelRatio || 1;
            const snapPos = (v) => Math.round(v * screenDpr) / screenDpr;

            xCss = snapPos(xCss);
            yCss = snapPos(yCss);

            return { x: xCss, y: yCss, w: wCss, h: hCss };
        }

        function layoutCanvas() {
            const renderDpr = currentRenderDpr || 1;
            const { x, y, w, h } = computeRectCss(renderDpr);

            container.style.left = x + 'px';
            container.style.top = y + 'px';
            container.style.width = w + 'px';
            container.style.height = h + 'px';
        }

        // API
        window.u59SetRenderDpr = function(dpr) {
            if (typeof dpr === 'number' && isFinite(dpr) && dpr > 0) {
                currentRenderDpr = dpr;
            } else {
                currentRenderDpr = window.devicePixelRatio || 1;
            }
            layoutCanvas();
        };

        window.u59LayoutCanvas = layoutCanvas;

        // initial
        layoutCanvas();

        // listeners используют текущий currentRenderDpr
        window.addEventListener('resize', layoutCanvas, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(layoutCanvas, 0), { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', layoutCanvas, { passive: true });
            window.visualViewport.addEventListener('scroll', layoutCanvas, { passive: true });
        }
    })();
</script>
<!-- Настройка кеширования wasm -->
<script>
    (function () {
        const origFetch = window.fetch;
        if (typeof origFetch !== "function") return;

        window.fetch = function(resource, init) {
            const url =
                (typeof resource === "string") ? resource :
                    (resource && resource.url) ? resource.url : "";

            // фикс только для Unity wasm
            const isUnityWasm =
                (url === "Build/WebGLBuild.wasm") || url.endsWith("/Build/WebGLBuild.wasm") ||
                (url.includes("Build/") && url.endsWith(".wasm"));

            if (!isUnityWasm) return origFetch(resource, init);
            // no-cache — одно из самых неудачно названных слов в веб‑кэшировании.
            // no-cache = “используй кэш, но всегда проверяй актуальность”.
            const forcedInit = Object.assign({}, init, { cache: "no-cache" });

            if (resource instanceof Request) {
                return origFetch(new Request(resource, forcedInit));
            }
            return origFetch(resource, forcedInit);
        };
    })();
</script>
<script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#unity-custom-loading-screen");
    var warningBanner = document.querySelector("#unity-warning");
    var actionPlaceholders = null;

    function unityShowBanner(msg, type) {
        console.warn("unityShowBanner: ");
        function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
            if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
            setTimeout(function() {
                warningBanner.removeChild(div);
                updateBannerVisibility();
            }, 5000);
        }
        updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
    var config = {
        dataUrl: buildUrl + "/WebGLBuild.data",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js",
        codeUrl: buildUrl + "/WebGLBuild.wasm",
        cacheControl: function (url) {
            // Кэшировать и ревалидировать (ETag/304) основные тяжелые файлы
            if (url.endsWith(".data") || url.endsWith(".wasm") || url.endsWith(".js"))
                return "must-revalidate";

            // Остальное (на моё усмотрение)
            return "must-revalidate";
        },
        streamingAssetsUrl: "StreamingAssets",
        companyName: "The Hopeless dev team",
        productName: "English Extract",
        productVersion: "0.0.0.1",
        showBanner: unityShowBanner,
        // Ensure Unity renders to the size we control
        matchWebGLToCanvasSize: true,
        webglContextAttributes: {
            alpha: false,
            // antialias: true,
            premultipliedAlpha: false,
            // preserveDrawingBuffer: false
        }
    };

    function afterViewportStable(cb) {
        console.warn("afterViewportStable: ");
        const vv = window.visualViewport;
        let raf;
        function run() {
            console.warn("RESIZE: run: ");
            cancelAnimationFrame(raf);
            // two RAFs helps Safari settle after layout/URL bar animations
            raf = requestAnimationFrame(() => requestAnimationFrame(cb));
        }
        if (vv) {
            vv.addEventListener('resize', run, { passive: true, once: true });
        }
        window.addEventListener('load', run, { once: true });
        // fallback if nothing fires
        requestAnimationFrame(() => requestAnimationFrame(cb));
    }

    var index = -1;
    let unityBooted = false;
    afterViewportStable(() => {
        console.warn("afterViewportStable: continuation: ");
        const TARGET_QUALITY = 1;
        
        // Make sure the canvas/container are laid out before we create Unity
        // if (window.u59LayoutCanvas) window.u59LayoutCanvas();
        (function () {
            // Canvas fills the JS-sized container
            canvas.style.width = '100%';
            canvas.style.height = '100%';

            // Optional: touch devices
            var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            if (isCoarse) {
                container.classList.add('unity-mobile');
                canvas.classList.add('unity-mobile');
            }

            // Normalize DPR with visualViewport scale, then apply your target quality
            var dpr = window.devicePixelRatio || 1;
            var scale = (window.visualViewport && typeof window.visualViewport.scale === 'number')
                ? window.visualViewport.scale : 1;

            console.warn('[normalized = dpr * scale * TARGET_QUALITY]', {
                dpr: dpr,
                scale: scale,
                TARGET_QUALITY: TARGET_QUALITY,
                delimeter: '---',
                window_devicePixelRatio: window.devicePixelRatio,
                window_visualViewport_is_not_null: window.visualViewport != null,
                typeof_window_visualViewport_scale_equals_number: typeof window.visualViewport.scale === 'number',
                window_visualViewport_scale: window.visualViewport && window.visualViewport.scale,
            });

            var normalized = dpr * scale * TARGET_QUALITY;
            normalized = Math.max(0.4, Math.min(3, normalized)); // clamp
            config.devicePixelRatio = normalized;

            console.log(
                `[DPR] raw=${dpr.toFixed(2)}, scale=${scale.toFixed(2)}, quality=${TARGET_QUALITY.toFixed(2)}, final=${config.devicePixelRatio.toFixed(2)}`
            );
            
            // ВАЖНО: layout под тот же DPR, что и Unity drawing buffer
            if (window.u59SetRenderDpr) window.u59SetRenderDpr(normalized);
            else if (window.u59LayoutCanvas) window.u59LayoutCanvas();

            // вызов расчёта позиций place-holders
            if (!actionPlaceholders && window.ActionPlaceholders) {
                actionPlaceholders = window.ActionPlaceholders.create({
                    containerId: 'unity-container',
                    backgroundId: 'background'
                });

                window.extraButtonPlaceholders = actionPlaceholders;
                window.extraButtonPlaceholderElements = actionPlaceholders.getPlaceholders();
            } else if (actionPlaceholders) {
                actionPlaceholders.requestRelayout();
            }

            console.warn('[Normalized DPR]', {
                ua: navigator.userAgent,
                dpr: dpr,
                scale: scale,
                configDPR: normalized
            });
        })();

        console.warn("end compute dpr function. ");

        if (unityBooted) return;   // важный гард
        unityBooted = true;

        loadingScreen.style.display = "block";
        if (window.BritlinesLoadingOverlay) {
            window.BritlinesLoadingOverlay.start();
        }

        const script = document.createElement("script");
        script.src = loaderUrl;
        console.warn("script.onload: ");
        script.onload = () => {
            // One more layout pass right before creating the instance (safety)
            if (window.u59SetRenderDpr) window.u59SetRenderDpr(config.devicePixelRatio);
            else if (window.u59LayoutCanvas) window.u59LayoutCanvas();

            // safety-pass
            if (actionPlaceholders) {
                actionPlaceholders.requestRelayout();
            }

            index++;
            console.warn("script.onload: createUnityInstance: index: " + index);
            createUnityInstance(canvas, config, (progress) => {
                console.log("createUnityInstance: progress: " + progress);
                if (window.BritlinesLoadingOverlay) {
                    window.BritlinesLoadingOverlay.setUnityProgress(progress);
                }
            }).then((unityInstance) => {
                console.warn("createUnityInstance: finished");
                window.unityInstance = unityInstance;

                if (window.BritlinesLoadingOverlay) {
                    window.BritlinesLoadingOverlay.markUnityReady();
                }

                window.onSliderBridgeReady = function () {
                    console.warn('SliderBridge ready! ');
                };
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    });
</script>
