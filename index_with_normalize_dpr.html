<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>English H</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" type="text/css" href="TemplateData/loading-bar.css"/>
    <link rel="stylesheet" href="TemplateData/spinner.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
      <div id="unity-custom-loading-screen">
        <div id="custom-logo-background">
          <div id="logo-box" style="justify-content: center; display: flex">
            <div id="logo"></div>
          </div>
          <div id="progress-box">
            <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
          </div>
        </div>
      </div>
      <div id="unity-custom-loader-bar">
        <div id="loader-box">
          <div id="loader-bar">
            <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">English Extract</div>
      </div>
    </div>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <script src='JsCursorLockChangeHandler.js'></script>
    <script src='JsSwitchAudioContext.js'></script>
    <script src='JsReloadPageHandler.js'></script>
    <script src='JsFirstFrame.js'></script>
    <script src='JsMouseLeaveMouseEnter.js'></script>
    <script src='JsLoaderBar.js'></script>
    <script src='JsClearUrl.js'></script>
    <script src='JsChangeUrlAndTitle.js'></script>
    <script src="overlayinfo.js"></script>
    <script src="quality-toolbar.js"></script>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingScreen = document.querySelector("#unity-custom-loading-screen");
      // var barElement = loadingScreen.querySelector("#ld-progress-bar");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) { 
        console.warn("unityShowBanner: ");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGLBuild.data",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js",
        codeUrl: buildUrl + "/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "The Hopeless dev team",
        productName: "English Extract",
        productVersion: "0.0.0.1",
        showBanner: unityShowBanner,
      };
      
      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;




      function afterViewportStable(cb) {
        const vv = window.visualViewport;
        let raf;
        function run() {
          cancelAnimationFrame(raf);
// two RAFs helps Safari settle after layout/URL bar animations
          raf = requestAnimationFrame(() => requestAnimationFrame(cb));
        }
        if (vv) {
          vv.addEventListener('resize', run, { passive: true, once: true });
        }
        window.addEventListener('load', run, { once: true });
// fallback if nothing fires
        requestAnimationFrame(() => requestAnimationFrame(cb));
      }

      afterViewportStable(() => {
        
        const TARGET_QUALITY = 0.55;
        (function () {
  // 1) Always set viewport meta (consistent CSS viewport across modes)
  //         var meta = document.querySelector('meta[name="viewport"]');
  //         if (!meta) {
  //           meta = document.createElement('meta');
  //           meta.name = 'viewport';
  //           document.head.appendChild(meta);
  //         }
  //         meta.content = 'width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no';
  
  // 2) Fill the canvas; optionally add your mobile class using feature detection
          canvas.style.width = '100%';
          canvas.style.height = '100%';
  
  // If you still want "mobile" styling on touch devices, use pointer: coarse (feature detection)
          var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          if (isCoarse) {
            container.classList.add('unity-mobile');
            canvas.classList.add('unity-mobile');
          }
  
  // 3) Normalize DPR using visualViewport.scale so “Request Desktop Website” matches mobile
          var dpr = window.devicePixelRatio || 1;
          var scale = (window.visualViewport && typeof window.visualViewport.scale === 'number')
                  ? window.visualViewport.scale : 1;
          console.warn('[normalized = dpr * scale * TARGET_QUALITY]', {
            dpr: dpr,
            scale: scale,
            TARGET_QUALITY: TARGET_QUALITY,
            delimeter: '---',
            window_devicePixelRatio: window.devicePixelRatio,
            window_visualViewport_is_not_null: window.visualViewport != null,
            typeof_window_visualViewport_scale_equals_number: typeof window.visualViewport.scale === 'number',
            window_visualViewport_scale: window.visualViewport.scale,
          })
  // Tune this to your taste (0.5 ≈ render at half of the on-screen pixel density)
  //         var TARGET_QUALITY = 1;
  
          var normalized = dpr * scale * TARGET_QUALITY;
          normalized = Math.max(0.4, Math.min(3, normalized)); // clamp
          config.devicePixelRatio = normalized;
  
          console.warn('[Normalized DPR]', {
            ua: navigator.userAgent,
            dpr: dpr,
            scale: scale,
            configDPR: normalized
          });
        })();
        
        console.warn("end compute dpr function. ");
        
        
        // function getDevicePixelRatioIndex() {
        //   console.warn("getDevicePixelRatioIndex: " + config.devicePixelRatio);
        //   return config.devicePixelRatio;
        // }
        
        loadingScreen.style.display = "block";
        
        /////
        var dbg = setupWebGLOverlayInfo({
          canvas: canvas,           // your canvas element or selector
          container: container,     // your container element or selector
          config: config,           // the same config you pass to Unity
          qualityFactor: TARGET_QUALITY,       // optional
          consoleLog: true          // optional: log on every update
        });
        ///// quality buttons: 
        var qUI = attachQualityButtons(dbg, {
          position: 'bl',  // tl, tr, bl, br (default 'tr')
          step: 0.1,
          min: 0.1,
          max: 4
        });
        /////
        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => 
        {
          createUnityInstance(canvas, config, (progress) => 
          {
            // setProgress(progress);
            console.log("createUnityInstance: progress: " + progress);
          }).
            then((unityInstance) => 
            {
              console.warn("createUnityInstance: finished");
              // loadingProgress = 95;
              // requestAnimationFrame(fillProgress);
            }).
              catch((message) => 
              {
                alert(message);
              });
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
